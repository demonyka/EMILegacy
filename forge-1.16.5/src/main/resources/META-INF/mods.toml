modLoader = "javafml"
loaderVersion = "[36,)"
license = "MIT"
issueTrackerURL = "https://github.com/demonyka/EMILegacy/issues"

[[mods]]
modId = "emi"
version = "${version}"
displayName = "EMI"
authors = "Emi (original mod), EMI Legacy contributors (1.16.5 port)"
credits = "Port of EMI by Emi: https://github.com/emilyploszaj/emi"
displayURL = "https://github.com/demonyka/EMILegacy"
description = '''
A featureful and accessible item and recipe viewer.

Unofficial port of EMI to Minecraft 1.16.5 (Forge). Install JEI next to EMI to see recipes
from other mods: EMI reads every JEI recipe category and hides JEI's own interface.

This is not the original mod: please do not report issues with this port to the EMI issue tracker.
'''
logoFile = "icon.png"

[[dependencies.emi]]
modId = "forge"
mandatory = true
versionRange = "[36.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.emi]]
modId = "minecraft"
mandatory = true
versionRange = "[1.16.5,1.17)"
ordering = "NONE"
side = "BOTH"

[[dependencies.emi]]
modId = "jei"
mandatory = false
versionRange = "[7.7,)"
ordering = "NONE"
side = "CLIENT"
