import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter

plugins {
	id "dev.architectury.loom" version "1.7-SNAPSHOT"
}

base.archivesName = project.archives_base_name
version = "${project.mod_version}+${project.minecraft_version}+forge"
group = project.maven_group

repositories {
	maven { url "https://maven.blamejared.com/" }
}

loom {
	accessWidenerPath = file("src/main/resources/emi.accesswidener")
	forge {
		convertAccessWideners = true
		mixinConfig "emi.mixins.json"
		mixinConfig "emi-forge.mixins.json"
	}
}

configurations {
	jabel
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	forge "net.minecraftforge:forge:${project.forge_version}"

	// JEI is optional at runtime: it is the bridge to recipes of other mods (machines etc.)
	modCompileOnly("mezz.jei:jei-1.16.5:${project.jei_version}") { transitive = false }
	modLocalRuntime("mezz.jei:jei-1.16.5:${project.jei_version}") { transitive = false }

	// Jabel lets us keep modern Java syntax (switch arrows, instanceof patterns) while emitting Java 8 bytecode
	annotationProcessor "com.github.bsideup.jabel:jabel-javac-plugin:1.0.0"
	compileOnly "com.github.bsideup.jabel:jabel-javac-plugin:1.0.0"
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	sourceCompatibility = 17
	options.release = 8
	options.compilerArgs += ["-Xmaxerrs", "5000"]
}

processResources {
	inputs.property "version", project.version
	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}
}

// EMI applies its own @Extends/@AdditionalField transformations to its classes through a synthetic
// pseudo-mixin that targets every non-mixin EMI class. Ported verbatim from upstream build.gradle.
def synthMixinDir = layout.buildDirectory.dir("generated-class")

tasks.register('generateClassLists') {
	inputs.files(sourceSets.main.output.classesDirs)
	outputs.dir(synthMixinDir)
	dependsOn tasks.named("compileJava")

	doLast {
		def outputFile = new File(synthMixinDir.get().asFile, "dev/emi/emi/mixin/GlobalMixin.class")
		outputFile.parentFile.mkdirs()

		def classNames = []
		def classCount = 0

		sourceSets.main.output.classesDirs.each { dir ->
			if (dir.exists()) {
				dir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
					def p = file.path.toLowerCase()
					if (file.name.endsWith('.class') && !p.contains("mixin") && !p.contains('emiconfig$')) {
						def relativePath = dir.toPath().relativize(file.toPath()).toString()
						classNames += relativePath.replace('.class', '').replace(File.separator, '.')
						classCount++
					}
				}
			}
		}

		def parseHex = { hex -> hex.split().collect { j -> Integer.parseInt(j, 16) } }
		def u2 = { num -> [(num >> 8), (num & 0xff)] }

		def binary = [0xca, 0xfe, 0xba, 0xbe, 0x00, 0x00, 0x00, 0x34]
		binary += u2(0x0b + classCount)
		binary += parseHex("""
			01 00 1d
				64 65 76 2f 65 6d 69 2f 65 6d 69 2f 6d 69 78 69
				6e 2f 47 6c 6f 62 61 6c 4d 69 78 69 6e
			07 00 01
			01 00 10
				6a 61 76 61 2f 6c 61 6e 67 2f 4f 62 6a 65 63 74
			07 00 03
			01 00 10
				47 6c 6f 62 61 6c 4d 69 78 69 6e 2e 6a 61 76 61
			01 00 24
				4c 6f 72 67 2f 73 70 6f 6e 67 65 70 6f 77 65 72
				65 64 2f 61 73 6d 2f 6d 69 78 69 6e 2f 50 73 65
				75 64 6f 3b
			01 00 23
				4c 6f 72 67 2f 73 70 6f 6e 67 65 70 6f 77 65 72
				65 64 2f 61 73 6d 2f 6d 69 78 69 6e 2f 4d 69 78
				69 6e 3b
			01 00 07
				74 61 72 67 65 74 73
			01 00 0a
				53 6f 75 72 63 65 46 69 6c 65
			01 00 1b
				52 75 6e 74 69 6d 65 49 6e 76 69 73 69 62 6c 65
				41 6e 6e 6f 74 61 74 69 6f 6e 73
		""")
		for (int i = 0; i < classCount; i++) {
			binary += parseHex("01")
			binary += u2(classNames[i].length())
			binary.addAll(classNames[i].getBytes())
		}
		binary += parseHex("""
			06 01 00 02 00 04
			00 00
			00 00
			00 00
			00 02
			00 09 00 00 00 02 00 05
			00 0a 00 00
		""")
		binary += u2(9 + (classCount * 3))
		binary += parseHex("00 02 00 06 00 00 00 07 00 01 00 08 5b")
		binary += u2(classCount)
		for (int i = 0; i < classCount; i++) {
			binary += parseHex("73") + u2(0x0b + i)
		}

		ClassReader reader = new ClassReader(binary as byte[])
		ClassWriter writer = new ClassWriter(reader, 0)
		reader.accept(writer, 0)
		outputFile.bytes = writer.toByteArray()
	}
}

sourceSets.main.output.dir(synthMixinDir, builtBy: generateClassLists)
